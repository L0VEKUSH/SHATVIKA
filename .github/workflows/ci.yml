name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Clean install and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_APP_URL: https://example.invalid
      NEXT_PUBLIC_SITE_URL: https://example.invalid
      NEXT_PUBLIC_SITE_NAME: SHATVIKA CORNER (CI)
      BUSINESS_TIME_ZONE: Asia/Kolkata
      ADMIN_JWT_SECRET: ci-only-admin-secret-000000000000000000000000000000000000000000000000
      CUSTOMER_JWT_SECRET: ci-only-customer-secret-0000000000000000000000000000000000000000000000
      WORKER_JWT_SECRET: ci-only-worker-secret-000000000000000000000000000000000000000000000000
      CSRF_SECRET: ci-only-csrf-secret-0000000000000000000000000000000000000000000000000
      ADMIN_BOOTSTRAP_ENABLED: 'false'
      DELIVERY_ENABLED: 'false'
      COUNTER_LOCATION_ID: ci-counter
      COUNTER_LOCATION_NAME: SHATVIKA CORNER CI
      COUNTER_TOKEN_PREFIX: SC
      TAX_RATE_BASIS_POINTS: '500'
      DELIVERY_FEE_PAISE: '4000'
      FREE_DELIVERY_THRESHOLD_PAISE: '50000'
      SERVICEABLE_POSTAL_CODES: '110001'
      MAX_QUANTITY_PER_ITEM: '10'
      TARGET_DELIVERY_MINUTES: '45'
      TARGET_PREPARATION_MINUTES: '20'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up documented Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm

      - name: Set up documented npm runtime
        run: npm install --global npm@11.6.2

      - name: Record runtime versions
        run: |
          node --version
          npm --version
          test "$(npm --version)" = "11.6.2"

      - name: Clean dependency install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Transactional integration tests
        run: npm run test:integration

      - name: Dependency audit
        run: npm run deps:review

      - name: Production build
        run: npm run build:production

  dependency-review:
    name: Pull-request dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
